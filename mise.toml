[tools]
bun = "latest"
go = "latest"
node = "22"
rust = "stable"
"npm:@openai/codex" = "latest"
"npm:windmill-cli" = "latest"
tlrc = "latest"
uv = "latest"
# TEMPORARY PIN (added 2026-04-28): pnpm v11.0.0 renamed its GitHub release
# assets from `pnpm-macos-*` (raw binary) to `pnpm-darwin-*.tar.gz`. The
# aqua-registry definition mise uses for `aqua:pnpm/pnpm` still matches the
# v10 scheme, so `mise upgrade pnpm` fails to resolve any asset for v11+.
# Tracking upstream fix: https://github.com/aquaproj/aqua-registry/issues/52815
# Once that PR merges and you've run `mise plugins update`, revert to "latest".
pnpm = "10"
"npm:@steipete/summarize" = "latest"
"npm:pm2" = "latest"
"npm:@google/clasp" = "latest"
"npm:opencode-ai" = "latest"
"npm:@kilocode/cli" = "latest"
"npm:@verygoodplugins/mcp-freescout" = "latest"
"npm:md-to-pdf" = "latest"
"cargo:aisw" = "latest"
"npm:agent-browser" = "latest"

[settings]
idiomatic_version_file_enable_tools = []

[settings.npm]
bun = true
